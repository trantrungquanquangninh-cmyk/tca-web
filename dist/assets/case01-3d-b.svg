3,329" stroke="#246993" stroke-width="7" /><text class="label" x="504.5" y="258.0" text-anchor="middle">W03-B</text><polygon points="179.0,241.0 272.0,289.0 272.0,217.0 179.0,169.0" fill="#b87810" fill-opacity=".64" stroke="#b87810" stroke-width="3" /><path d="M179,169 L272,217" stroke="#b87810" stroke-width="7" /><text class="label" x="225.5" y="178.0" text-anchor="middle">W04</text><text x="34" y="530" font-size="17">W04: cùng vị trí · Rev A: vách tiêu chuẩn · Rev B: vách chống cháy</text><text x="34" y="555" font-size="15">Sơ đồ giả định để thảo luận phương pháp; không dùng để bóc khối lượng thực tế.</text></svg>