<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc"><title id="title">BRIEFING ĐỘI MỚI &amp; CHUYỂN KHU</title><desc id="desc">Sơ đồ tầng 12 giả định: thang máy hàng, tuyến vận chuyển nội bộ, điểm tập kết và hai khu thi công A, B.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#df6328" stroke-width="1.6"/></marker></defs><rect width="1000" height="650" fill="#f1f5f8"/><g font-family="Arial,sans-serif" fill="#102e47"><text x="34" y="43" font-size="23" font-weight="bold">BRIEFING ĐỘI MỚI &amp; CHUYỂN KHU</text><text x="34" y="77" font-size="17">Rà soát khu A, bàn giao phần việc và thống nhất bước tiếp theo tại khu B.</text><rect x="55" y="130" width="890" height="355" fill="white" stroke="#102e47" stroke-width="5"/><rect x="80" y="160" width="150" height="160" fill="#e4eaf0" stroke="#9bb0bf"/><text x="98" y="195" font-size="19">KHU ĐANG</text><text x="98" y="225" font-size="19">HOẠT ĐỘNG</text><text x="98" y="266" font-size="16">Phối hợp giờ làm</text><text x="98" y="292" font-size="16">và lối tiếp cận</text><rect x="280" y="160" width="285" height="175" fill="#e8f0f6" stroke="#246993" stroke-width="2"/><rect x="610" y="160" width="305" height="175" fill="#fff0dd" stroke="#246993" stroke-width="2"/><text x="300" y="194" font-size="23" font-weight="bold">KHU A</text><text x="630" y="194" font-size="23" font-weight="bold">KHU B</text><path d="M310 230 H410 V300 M410 260 H530 M650 230 H750 V300 M750 260 H880" fill="none" stroke="#607f96" stroke-width="8"/><rect x="80" y="355" width="150" height="105" fill="#dce6ed" stroke="#102e47" stroke-width="2"/><text x="95" y="385" font-size="18">THANG MÁY</text><text x="95" y="413" font-size="18">HÀNG</text><text x="95" y="444" font-size="15">Đặt lịch sử dụng</text><rect x="320" y="363" width="180" height="90" fill="#fff0dd" stroke="#b87810" stroke-width="2" stroke-dasharray="7 5"/><text x="335" y="391" font-size="18">ĐIỂM TẬP KẾT</text><text x="335" y="420" font-size="16">Cấp theo từng đợt</text><path d="M235 435 H285 V345 H585 V435 H895" fill="none" stroke="#df6328" stroke-width="5" marker-end="url(#arrow)"/><text x="620" y="470" font-size="16">Tuyến vận chuyển nội bộ dự kiến</text><text x="300" y="321" font-size="16">Kiểm tra trước khi chuyển bước</text><rect x="780" y="276" width="112" height="37" fill="#b87810"/><text x="791" y="301" font-size="17" fill="white">ĐỘI MỚI</text><text x="55" y="534" font-size="20" font-weight="bold">Briefing bằng hình ảnh</text><text x="55" y="565" font-size="17">Chỉ rõ vị trí, phạm vi và việc kế tiếp.</text><text x="530" y="534" font-size="20" font-weight="bold">Dùng chung một phiên bản</text><text x="530" y="565" font-size="17">Cập nhật theo phương án đã thống nhất.</text><text x="34" y="613" font-size="16">Sơ đồ giả định phục vụ bài học · Không phải mặt bằng hoặc biện pháp thi công được phê duyệt</text></g></svg>