<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 570" role="img" aria-labelledby="title desc"><title id="title">CHỒNG BẢN VẼ 2D · REV A / REV B</title><desc id="desc">Mặt bằng chồng hai phiên bản với đường nét đứt biểu thị tường cũ và đường liền biểu thị tường mới.</desc><rect width="900" height="570" fill="#f4f7fa"/><style>text{font-family:Arial,sans-serif;fill:#102e47}.label{font-size:17px;font-weight:bold;paint-order:stroke;stroke:#f4f7fa;stroke-width:5px;stroke-linejoin:round}</style><text x="34" y="42" font-size="22" font-weight="bold">CHỒNG BẢN VẼ 2D · REV A / REV B</text><text x="34" y="72" font-size="16">Đối chiếu vị trí tường và đánh dấu thay đổi trên mặt bằng</text><rect x="110" y="110" width="624" height="352" fill="white" stroke="#102e47" stroke-width="9"/><path d="M110,242 L318,242" stroke="#246993" stroke-width="8" /><text class="label" x="226.0" y="230.0">W01</text><path d="M318,110 L318,462" stroke="#c4424b" stroke-width="8" stroke-dasharray="12 8"/><text class="label" x="330.0" y="274.0">W02-A</text><path d="M370,110 L370,462" stroke="#087f72" stroke-width="8" /><text class="label" x="382.0" y="274.0">W02-B</text><path d="M318,330 L734,330" stroke="#c4424b" stroke-width="8" stroke-dasharray="12 8"/><text class="label" x="538.0" y="318.0">W03-A</text><path d="M370,286 L734,286" stroke="#087f72" stroke-width="8" /><text class="label" x="564.0" y="274.0">W03-B</text><path d="M110,374 L266,374" stroke="#b87810" stroke-width="8" /><text class="label" x="200.0" y="362.0">W04</text><circle cx="344" cy="286" r="46" fill="none" stroke="#c4424b" stroke-width="2" stroke-dasharray="4 4"/><path d="M390 286 L790 220" fill="none" stroke="#c4424b"/><text x="620" y="196" font-size="17">Dịch chuyển vách</text><text x="34" y="522" font-size="17">Nét đứt: tường cũ · Nét liền: tường mới / giữ nguyên / đổi loại</text><text x="34" y="551" font-size="15">Sơ đồ giả định · Cùng một bố trí với hình 3D · Không theo tỷ lệ thi công</text></svg>